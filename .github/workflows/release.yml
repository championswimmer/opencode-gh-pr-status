name: Release to npm

# Configure release.yml as an npm trusted publisher before pushing any tags.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@^11.5.1
      - name: Verify the tag matches the package version and is on main
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: git diff --exit-code -- dist
      - name: Publish with npm trusted publishing
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) NPM_TAG="next" ;;
            *) NPM_TAG="latest" ;;
          esac
          npm publish --access public --tag "$NPM_TAG" --ignore-scripts
